<svg xmlns="http://www.w3.org/2000/svg" width="1500" height="1050" viewBox="0 0 1500 1050">
  <defs>
    <marker id="arrow" markerWidth="11" markerHeight="11" refX="9" refY="5.5" orient="auto">
      <path d="M0,0 L10,5.5 L0,11 z" fill="#475569"/>
    </marker>
    <marker id="inherit" markerWidth="18" markerHeight="18" refX="16" refY="9" orient="auto">
      <path d="M16,9 L2,2 L2,16 z" fill="#fff" stroke="#475569" stroke-width="2"/>
    </marker>
    <style>
      text { font-family: "Segoe UI", Arial, sans-serif; fill: #172033; }
      .title { font-size: 30px; font-weight: 700; }
      .subtitle { font-size: 15px; fill: #475569; }
      .box { fill: #fff; stroke: #64748b; stroke-width: 2; rx: 10; }
      .persona { fill: #eff6ff; stroke: #2563eb; stroke-width: 2; rx: 10; }
      .dominio { fill: #ecfdf5; stroke: #15803d; stroke-width: 2; rx: 10; }
      .patron { fill: #fff7ed; stroke: #ea580c; stroke-width: 3; rx: 10; }
      .repo { fill: #f5f3ff; stroke: #7c3aed; stroke-width: 3; rx: 10; }
      .heading { font-size: 17px; font-weight: 700; }
      .body { font-size: 13px; }
      .small { font-size: 12px; }
      .label { font-size: 12px; fill: #334155; font-weight: 700; }
      .muted { fill: #475569; }
      .line { fill: none; stroke: #475569; stroke-width: 2; }
      .association { fill: none; stroke: #475569; stroke-width: 2; marker-end: url(#arrow); }
      .inheritance { fill: none; stroke: #475569; stroke-width: 2.5; marker-end: url(#inherit); }
      .dash { fill: none; stroke: #475569; stroke-width: 2; stroke-dasharray: 7 5; marker-end: url(#arrow); }
    </style>
  </defs>

  <rect width="1500" height="1050" fill="#f8fafc"/>
  <text x="750" y="42" text-anchor="middle" class="title">Sistema de gestión hospitalaria - Diagrama UML completo</text>
  <text x="750" y="68" text-anchor="middle" class="subtitle">Clases principales, relaciones y patrones de diseño aplicados</text>

  <!-- Usuario y especializaciones -->
  <rect x="45" y="105" width="300" height="175" class="persona"/>
  <text x="195" y="138" text-anchor="middle" class="heading">Usuario</text>
  <line x1="65" y1="150" x2="325" y2="150" stroke="#94a3b8"/>
  <text x="65" y="174" class="body">- id, nombre, apellido, dni</text>
  <text x="65" y="196" class="body">- usuario, password, rol</text>
  <text x="65" y="218" class="body">- activo: bool</text>
  <text x="65" y="252" class="body">+ aDiccionario(): dict</text>
  <text x="65" y="272" class="body">+ estaActivo(): bool</text>

  <rect x="45" y="355" width="230" height="145" class="persona"/>
  <text x="160" y="388" text-anchor="middle" class="heading">UsuarioMedico</text>
  <line x1="60" y1="400" x2="260" y2="400" stroke="#94a3b8"/>
  <text x="60" y="424" class="body">- especialidad: str</text>
  <text x="60" y="447" class="body">+ atenderTurno(): void</text>
  <text x="60" y="469" class="body">+ consultarHistoria(): void</text>

  <rect x="310" y="355" width="230" height="145" class="persona"/>
  <text x="425" y="388" text-anchor="middle" class="heading">UsuarioSecretaria</text>
  <line x1="325" y1="400" x2="525" y2="400" stroke="#94a3b8"/>
  <text x="325" y="424" class="body">+ registrarTurno(): void</text>
  <text x="325" y="447" class="body">+ cancelarTurno(): void</text>
  <text x="325" y="469" class="body">+ reprogramarTurno(): void</text>

  <path d="M160 355 V325 H195 V280" class="inheritance"/>
  <path d="M425 355 V325 H195 V280" class="inheritance"/>
  <text x="215" y="310" class="label">herencia</text>

  <!-- Paciente -->
  <rect x="45" y="585" width="300" height="180" class="dominio"/>
  <text x="195" y="618" text-anchor="middle" class="heading">Paciente</text>
  <line x1="65" y1="630" x2="325" y2="630" stroke="#94a3b8"/>
  <text x="65" y="654" class="body">- id, nombre, apellido, dni</text>
  <text x="65" y="676" class="body">- telefono, direccion</text>
  <text x="65" y="698" class="body">- fechaNacimiento: str</text>
  <text x="65" y="720" class="body">- activo: bool</text>
  <text x="65" y="748" class="body">+ aDiccionario(): dict</text>

  <!-- Agenda y bloques -->
  <rect x="600" y="105" width="280" height="175" class="dominio"/>
  <text x="740" y="138" text-anchor="middle" class="heading">Agenda</text>
  <line x1="620" y1="150" x2="860" y2="150" stroke="#94a3b8"/>
  <text x="620" y="174" class="body">- id: int</text>
  <text x="620" y="196" class="body">- idMedico: int</text>
  <text x="620" y="218" class="body">- dias: list</text>
  <text x="620" y="252" class="body">+ agregarBloque(): void</text>
  <text x="620" y="272" class="body">+ consultarDisponibilidad(): list</text>

  <rect x="980" y="105" width="270" height="175" class="dominio"/>
  <text x="1115" y="138" text-anchor="middle" class="heading">BloqueHorario</text>
  <line x1="1000" y1="150" x2="1230" y2="150" stroke="#94a3b8"/>
  <text x="1000" y="174" class="body">- dia: str</text>
  <text x="1000" y="196" class="body">- horaInicio: str</text>
  <text x="1000" y="218" class="body">- horaFin: str</text>
  <text x="1000" y="252" class="body">+ estaDisponible(): bool</text>

  <path d="M880 192 H980" class="line"/>
  <path d="M880 192 l -12 -7 M880 192 l -12 7" class="line"/>
  <text x="900" y="180" class="label">1 contiene 1..*</text>
  <text x="925" y="218" class="label">composición</text>

  <!-- Relaciones entre médico y agenda -->
  <path d="M275 420 H600 V280" class="association"/>
  <text x="410" y="410" class="label">1 administra 1</text>

  <!-- Turno -->
  <rect x="600" y="585" width="300" height="180" class="dominio"/>
  <text x="750" y="618" text-anchor="middle" class="heading">Turno</text>
  <line x1="620" y1="630" x2="880" y2="630" stroke="#94a3b8"/>
  <text x="620" y="654" class="body">- id, fecha, hora, estado</text>
  <text x="620" y="676" class="body">- motivoConsulta: str</text>
  <text x="620" y="698" class="body">- historialReprogramaciones: list</text>
  <text x="620" y="720" class="body">+ cancelar/reprogramar()</text>
  <text x="620" y="748" class="body">+ marcarAusente/marcarAtendido()</text>

  <path d="M345 675 H600" class="association"/>
  <text x="400" y="662" class="label">Paciente 1 solicita 0..*</text>
  <text x="485" y="700" class="label">asociación</text>

  <path d="M275 500 V545 H750 V585" class="association"/>
  <text x="335" y="532" class="label">Médico 1 atiende 0..*</text>

  <path d="M740 280 V585" class="association"/>
  <text x="752" y="330" class="label">Agenda 1 dispone horario 0..*</text>

  <!-- Atención y adenda -->
  <rect x="985" y="585" width="290" height="180" class="dominio"/>
  <text x="1130" y="618" text-anchor="middle" class="heading">AtencionClinica</text>
  <line x1="1005" y1="630" x2="1255" y2="630" stroke="#94a3b8"/>
  <text x="1005" y="654" class="body">- datos: dict</text>
  <text x="1005" y="676" class="body">- observaciones, diagnostico</text>
  <text x="1005" y="698" class="body">- indicaciones: str</text>
  <text x="1005" y="720" class="body">+ agregarAdenda(): void</text>
  <text x="1005" y="748" class="body">+ aDiccionario(): dict</text>

  <rect x="985" y="835" width="290" height="135" class="dominio"/>
  <text x="1130" y="868" text-anchor="middle" class="heading">Adenda</text>
  <line x1="1005" y1="880" x2="1255" y2="880" stroke="#94a3b8"/>
  <text x="1005" y="904" class="body">- fecha: str</text>
  <text x="1005" y="926" class="body">- idMedico: int</text>
  <text x="1005" y="948" class="body">- texto: str</text>
  <text x="1005" y="966" class="body">+ aDiccionario(): dict</text>

  <path d="M1130 765 V835" class="association"/>
  <text x="1142" y="795" class="label">1 contiene 0..*</text>
  <text x="1142" y="816" class="label">composición</text>

  <path d="M900 675 H985" class="association"/>
  <text x="905" y="663" class="label">0..1 genera 0..1</text>

  <path d="M345 720 V805 H1130 V765" class="association"/>
  <text x="390" y="796" class="label">Paciente 1 tiene 0..* AtencionClinica</text>

  <path d="M275 500 V820 H985 V765" class="association"/>
  <text x="305" y="814" class="label">Médico 1 registra 0..*</text>

  <!-- Patrones -->
  <rect x="380" y="835" width="250" height="135" class="patron"/>
  <text x="505" y="868" text-anchor="middle" class="heading">FabricaAtencion</text>
  <text x="505" y="890" text-anchor="middle" class="small muted">Factory Method</text>
  <line x1="400" y1="900" x2="610" y2="900" stroke="#fdba74"/>
  <text x="400" y="924" class="body">+ crear(...):</text>
  <text x="400" y="946" class="body">AtencionClinica</text>

  <path d="M630 902 H985" class="dash"/>
  <text x="690" y="890" class="label">crea</text>

  <rect x="665" y="835" width="250" height="135" class="repo"/>
  <text x="790" y="868" text-anchor="middle" class="heading">RepositorioJson</text>
  <text x="790" y="890" text-anchor="middle" class="small muted">Singleton</text>
  <line x1="685" y1="900" x2="895" y2="900" stroke="#c4b5fd"/>
  <text x="685" y="924" class="body">+ cargar(ruta): list</text>
  <text x="685" y="946" class="body">+ guardar(ruta, datos): void</text>

  <!-- Leyenda y justificación -->
  <rect x="45" y="810" width="280" height="210" class="box"/>
  <text x="65" y="842" class="heading">Justificación de relaciones</text>
  <text x="65" y="870" class="small"><tspan font-weight="700">Herencia:</tspan> tipos de usuario.</text>
  <text x="65" y="894" class="small"><tspan font-weight="700">Agregación:</tspan> paciente y médico</text>
  <text x="65" y="914" class="small">participan en varios turnos.</text>
  <text x="65" y="938" class="small"><tspan font-weight="700">Composición:</tspan> Agenda contiene</text>
  <text x="65" y="958" class="small">bloques; atención contiene adendas.</text>
  <text x="65" y="982" class="small"><tspan font-weight="700">Patrones:</tspan> Factory Method y Singleton.</text>
</svg>
